name: Continuous integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/hooks/**'
      - '.github/homebrew/**'
      - '.github/settings.*'
      - '.github/actions/**'
      - 'index.html'
      - 'src/**'
      # the frontend imports and the app embeds the shipped examples
      - 'docs/specs/examples/**'
      - 'docs/specs/files.cue'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Makefile'

  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/hooks/**'
      - '.github/homebrew/**'
      - '.github/settings.*'
      - '.github/actions/**'
      - 'index.html'
      - 'src/**'
      # the frontend imports and the app embeds the shipped examples
      - 'docs/specs/examples/**'
      - 'docs/specs/files.cue'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'Makefile'
    tags: [ 'v*' ]

  schedule:
    - cron: 0 7 1 * * # at 07:00 on day-of-month 1, UTC

  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

permissions:
  contents: read

jobs:
  frontend:
    name: Testing the frontend
    # macOS, like the app: the scenarios press ⌘← and ⌘Z as editor keys,
    # which Chrome on Linux does not bind
    runs-on: macos-26

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          check-latest: true
      - name: Install dependencies
        run: npm ci
      # TypeScript, the Vite build, the version chain model and the scenarios
      # in headless Google Chrome, which the runner image ships
      - name: Run tests
        run: npm test

  native:
    name: Testing the native part
    runs-on: macos-26

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: Resolve the Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "${GITHUB_OUTPUT}"
      # warmup.caches.yml saves it on main; a PR or a tag only restores it
      - name: Restore the Cargo cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-
      # tauri-build embeds the frontend at compile time
      - name: Set up Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          check-latest: true
      - name: Build the frontend
        run: npm ci && npm run build

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --release --all-targets -- -D warnings
      # the test that edits through a running Ollama is ignored here
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # the cask cd publishes, rendered for placeholder bytes: brew style
      # checks it with the Homebrew of the runner, as the tap's users run it
      - name: Check the cask template
        run: |
          dir="$(mktemp -d)/Casks"
          mkdir -p "${dir}"
          for signing in adhoc developer-id; do
            node .github/scripts/release.mjs cask --version "$(node .github/scripts/release.mjs version)" \
              --sha256 "$(printf '0%.0s' $(seq 64))" --signing "${signing}" --out "${dir}/susi.rb"
            ruby -c "${dir}/susi.rb"
            (cd "${dir}/.." && brew style Casks/susi.rb)
          done

  release:
    name: Checking the release helpers
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Node.js environment
        uses: actions/setup-node@v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      # the release helpers, the hooks, the settings and the workflows fail
      # here, not on a tag
      - name: Check release helpers
        run: node --test .github/scripts/*.test.mjs
      - name: Check the version files agree
        run: node .github/scripts/release.mjs version
      - name: Install CUE and actionlint
        run: |
          go install cuelang.org/go/cmd/cue@v0.17.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Check the settings
        run: make config-vet
      - name: Check the workflows
        run: actionlint

  notify:
    name: Notifying
    needs: [ frontend, native, release ]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
      && (failure() || success())

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: ⚙️
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
