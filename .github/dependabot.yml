version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: inventory'
      - 'scope: deps'
    commit-message:
      prefix: 'ci/cd'
      include: 'scope'
    open-pull-requests-limit: 30

  # the app's frontend and the Tauri CLI
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: feature'
      - 'scope: code'
      - 'scope: deps'
    commit-message:
      prefix: 'feat'
      include: 'scope'
    open-pull-requests-limit: 30

  # the native part; Cargo.lock carries the app version, which a release
  # commit changes by hand, never Dependabot
  - package-ecosystem: cargo
    directory: /src-tauri/
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: feature'
      - 'scope: code'
      - 'scope: deps'
    commit-message:
      prefix: 'feat'
      include: 'scope'
    open-pull-requests-limit: 30

  - package-ecosystem: npm
    directory: /docs/
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: docs'
      - 'scope: deps'
    commit-message:
      prefix: 'docs'
      include: 'scope'
    open-pull-requests-limit: 30
